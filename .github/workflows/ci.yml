name: CPU release checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: nexus-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      NEXUS_EMBEDDING_PROVIDER: hash
      NEXUS_GENERATION_PROVIDER: mock
      NEXUS_RATE_LIMIT_PER_MINUTE: "10000"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-11-04
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.lock.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m pip install -r apps/api/requirements.lock.txt
      - run: python -m pip install -r apps/api/requirements-typecheck.txt
      - run: python scripts/typecheck.py
      - run: python -m ruff check apps/api scripts
      - run: mkdir -p artifacts
      - run: python -m pytest apps/api -q --basetemp artifacts/ci-tests
      - name: Backend syntax and schema contracts
        run: python -m compileall -q apps/api/nexus apps/api/migrations scripts
      - name: Offline grounding/source check
        run: python scripts/evaluate_grounding.py
      - name: Offline retrieval comparison
        run: python scripts/evaluate_retrieval.py --embedding-provider hash
      - name: Install web
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Web checks
        working-directory: apps/web
        run: |
          npm run typecheck
          npm run lint
          npm run build
          npx playwright install --with-deps chromium
      - name: Browser fixtures (no keys, no model download)
        shell: bash
        run: |
          python scripts/manage_byok_key.py --file "$RUNNER_TEMP/nexus-browser/.secrets/byok.key" --data artifacts/ci-browser
          export NEXUS_BYOK_MASTER_KEY_FILE="$RUNNER_TEMP/nexus-browser/.secrets/byok.key"
          python scripts/browser_provider_fixture.py > /tmp/nexus-provider.log 2>&1 &
          PYTHONPATH=apps/api NEXUS_DATA_DIR=artifacts/ci-browser python -m uvicorn nexus.main:app --host 127.0.0.1 --port 8000 --workers 1 --no-access-log > /tmp/nexus-api.log 2>&1 &
          NEXUS_TEST_PID=$!
          (cd apps/web && npm start > /tmp/nexus-web.log 2>&1) &
          python scripts/wait_ready.py
          cd apps/web
          npm run test:e2e
          cd ../..
          kill "$NEXUS_TEST_PID"
          wait "$NEXUS_TEST_PID" || true
          python scripts/server_test_fixture.py
          PYTHONPATH=apps/api NEXUS_PROFILE=server NEXUS_SECURE_COOKIES=false NEXUS_DATA_DIR=artifacts/phase3-server-browser python -m uvicorn nexus.main:app --host 127.0.0.1 --port 8000 --workers 1 --no-access-log > /tmp/nexus-server.log 2>&1 &
          python scripts/wait_ready.py
          cd apps/web
          NEXUS_SERVER_TEST=1 npx playwright test server.spec.ts

